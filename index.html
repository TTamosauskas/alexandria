<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Biblioteca Oculta — Agregador de PDFs de magia e ocultismo." />
    <title>Biblioteca Oculta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css?v=discovery-v1" />
    <script type="module" src="assets/js/app.js?v=discovery-v1"></script>
  </head>
  <body>
    <main class="library" id="library">
      <h1>Biblioteca Oculta</h1>
      <p class="subtitle">Agregador de PDFs de magia e ocultismo.</p>
      <p class="catalog-total" id="catalog-total" aria-live="polite">Pesquise no acervo</p>
      <nav class="library-tabs" aria-label="Navegar pela biblioteca">
        <button type="button" data-shelf-view="search" aria-pressed="true">Buscar</button>
        <button type="button" data-shelf-view="favorites" aria-pressed="false">Minha estante<span id="favorites-count"></span></button>
        <button type="button" data-shelf-view="recent" aria-pressed="false">Vistos recentemente</button>
      </nav>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search-input">Pesquisar documentos</label>
        <div class="search-field"><input id="search-input" name="q" type="search" autocomplete="off" aria-autocomplete="list" aria-controls="search-suggestions" aria-expanded="false" placeholder="Título, autor ou assunto..." />
          <ul id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Sugestões de livros" hidden></ul></div>
        <button type="submit">Pesquisar</button>
      </form>
      <fieldset class="language-filter" aria-label="Filtrar por idioma">
        <div class="language-options">
          <label><input type="radio" name="idioma" value="pt" /> português</label>
          <label><input type="radio" name="idioma" value="en" /> inglês</label>
          <label><input type="radio" name="idioma" value="es" /> espanhol</label>
          <label><input type="radio" name="idioma" value="all" checked /> todas</label>
        </div>
      </fieldset>
      <p class="status" id="status" aria-live="polite"></p>
      <section class="results" id="results" aria-live="polite"></section>
      <div class="results-sentinel" id="results-sentinel" aria-hidden="true"></div>
    </main>
  </body>
</html>
