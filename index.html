<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Biblioteca Oculta — Agregador de PDFs de magia e ocultismo." />
    <title>Biblioteca Oculta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body>
    <main class="library" id="library">
      <h1>Biblioteca Oculta</h1>
      <p class="subtitle">Agregador de pdfs de magia e ocultismo.</p>
      <fieldset class="language-filter">
        <legend>Idioma dos documentos</legend>
        <div class="language-options">
          <label><input type="radio" name="idioma" value="pt" /> português</label>
          <label><input type="radio" name="idioma" value="en" /> inglês</label>
          <label><input type="radio" name="idioma" value="es" /> espanhol</label>
          <label><input type="radio" name="idioma" value="all" checked /> todas</label>
        </div>
      </fieldset>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="search-input">Pesquisar documentos</label>
        <input id="search-input" name="q" type="search" autocomplete="off" placeholder="Pesquise por título, autor ou tema" />
        <button type="submit">Pesquisar</button>
      </form>
      <p class="status" id="status" aria-live="polite"></p>
      <section class="results" id="results" aria-live="polite"></section>
      <div class="results-sentinel" id="results-sentinel" aria-hidden="true"></div>
    </main>
  </body>
</html>
